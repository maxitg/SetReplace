# This file controls the behavior of Trunk: https://docs.trunk.io/cli
# To learn more about the format of this file, see https://docs.trunk.io/reference/trunk-yaml
version: 0.1
cli:
  version: 1.29.0
# Trunk provides extensibility via plugins. (https://docs.trunk.io/plugins)
plugins:
  sources:
    - id: trunk
      ref: v1.11.0
      uri: https://github.com/trunk-io/plugins
# Many linters and tools depend on runtimes - configure them here. (https://docs.trunk.io/runtimes)
runtimes:
  enabled:
    - node@22.16.0
    - python@3.14.4
tools:
  definitions:
    - name: cpplint
      runtime: python
      package: cpplint
      shims: [cpplint]
      known_good_version: 2.0.0
# This is the section where you manage your linters. (https://docs.trunk.io/check/configuration)
lint:
  files:
    - name: wolfram
      extensions: [m, wl, wls, wlt]
    # Text files that don't have a dedicated formatter
    - name: plain-text
      extensions: [cfg, in]
      filenames: [.clang-format, .gitignore, .shellcheckrc, LICENSE]
  definitions:
    # shfmt ignores .editorconfig if any formatting flags are passed, and Trunk passes -s, so set the indentation here
    - name: shfmt
      commands:
        - name: format
          run: shfmt -w -s -i 2 ${target}
    - name: whitespace-format
      description: Converts tabs to spaces, removes trailing whitespace and repeated empty lines, uses Unix line endings
      files: [wolfram, cmake, plain-text]
      commands:
        - name: format
          output: rewrite
          run: ${workspace}/scripts/whitespaceFormat.sh ${target}
          success_codes: [0]
          formatter: true
          batch: false
      environment:
        - name: PATH
          list: ["${env.PATH}"]
    - name: line-width
      description: Checks that lines are at most 120 characters long
      files: [wolfram, cmake, plain-text, shell, json]
      commands:
        - name: lint
          output: regex
          parse_regex: '(?P<path>[^:\n]+):(?P<line>\d+): (?P<message>.+)'
          run: ${workspace}/scripts/checkLineWidth.sh ${target} 120
          read_output_from: stdout
          success_codes: [0, 1]
          batch: false
      environment:
        - name: PATH
          list: ["${env.PATH}"]
        # Count characters rather than bytes
        - name: LC_ALL
          value: C.UTF-8
    - name: cpplint
      description: Checks C++ code against the Google C++ Style Guide
      files: [c++-header, c++-source]
      tools: [cpplint]
      commands:
        - name: lint
          output: regex
          parse_regex: '(?P<path>[^:\n]+):(?P<line>\d+):  (?P<message>.+)  \[(?P<code>[^\]]+)\] \[\d\]'
          # Trunk runs linters in a sandbox without .git, so cpplint can't find the repository root for header guards
          run: cpplint --quiet --extensions=hpp,cpp --repository=. ${target}
          read_output_from: stderr
          success_codes: [0, 1]
          batch: true
      direct_configs: [CPPLINT.cfg]
      known_good_version: 2.0.0
      version_command:
        parse_regex: ${semver}
        run: cpplint --version
  enabled:
    - checkov@3.4.11
    - clang-format@20.1.0
    - cpplint@2.0.0
    - git-diff-check
    - line-width
    - markdownlint@0.50.1
    - oxipng@10.2.1
    - prettier@3.10.1
    - shellcheck@0.11.0
    - shfmt@3.14.1
    - trufflehog@3.100.1
    - whitespace-format
    - yamllint@1.38.0
  ignore:
    # Excluded from linting, as they were in lint.sh
    - linters: [ALL]
      paths:
        # Vendored from Wolfram
        - libSetReplace/WolframHeaders/**
        # Generated by Xcode
        - SetReplace.xcodeproj/**
actions:
  enabled:
    - trunk-announce
    - trunk-check-pre-push
    - trunk-fmt-pre-commit
    - trunk-upgrade-available
